<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  #icon {
    position: relative; width: 1024px; height: 1024px;
    border-radius: 230px; overflow: hidden;
    background: linear-gradient(157deg, #7088ff 0%, #3a5ce0 52%, #4730a8 100%);
    box-shadow: inset 0 10px 0 rgba(255,255,255,0.35), inset 0 -60px 120px rgba(20,18,70,0.18), inset 0 0 0 4px rgba(0,0,0,0.04);
  }
  #icon .bars { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8%; }
  #icon .bars span { width: 7.4%; border-radius: 999px; background: #fff; }
  #icon .spark {
    position: absolute; top: 7.5%; right: 8%; width: 20%; height: 20%; background: #fff;
    clip-path: polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);
    filter: drop-shadow(0 8px 14px rgba(20,18,60,0.22));
  }
  #icon .gloss { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0.30), rgba(255,255,255,0) 46%); pointer-events: none; }
</style>
</head>
<body>
  <div id="icon">
    <div class="bars">
      <span style="height: 33%; background: rgba(255,255,255,0.88);"></span>
      <span style="height: 57%;"></span>
      <span style="height: 82%;"></span>
      <span style="height: 57%;"></span>
      <span style="height: 33%; background: rgba(255,255,255,0.88);"></span>
    </div>
    <div class="spark"></div>
    <div class="gloss"></div>
  </div>
</body>
</html>
