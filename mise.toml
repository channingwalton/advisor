[tasks.default]
description = "List available tasks"
run = "mise tasks ls --local --extended"

[tasks.commit-check]
alias = "cc"
description = "Clean, build, and test the app and sidecar"
run = [
    "cd App && swift package clean",
    "rm -rf sidecar/dist",
    "cd App && swift build",
    "cd App && swift test",
    "cd sidecar && npm ci --include=dev",
    "cd sidecar && npm run build",
    "cd sidecar && npm test",
    "git diff --check",
]

[tasks.dmg]
alias = "create-dmg"
description = "Build the signed and notarised DMG"
run = "cd App && sh dmg.sh"

[tasks.release]
description = "Build the DMG, sync the website, commit, and tag vVERSION"
run = '''
#!/usr/bin/env bash
set -euo pipefail
version=$(tr -d '[:space:]' < VERSION)
if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
    echo "error: tag v$version already exists — bump VERSION first" >&2
    exit 1
fi
# The bump must be committed: the tag must point at a commit containing
# the version it names (v0.2.0 tagged a commit still carrying 0.1.0).
if ! git diff --quiet -- VERSION || ! git diff --quiet --staged -- VERSION; then
    echo "error: VERSION has uncommitted changes — commit the bump first" >&2
    exit 1
fi
# www/index.html must be clean: the release commit must contain only the
# version-line sync, never sweep up unrelated edits.
if ! git diff --quiet -- www/index.html || ! git diff --quiet --staged -- www/index.html; then
    echo "error: www/index.html has uncommitted changes — commit or stash them first" >&2
    exit 1
fi
mise run dmg
dmg="App/dist/Advisor-$version.dmg"
size_mb=$(( ($(stat -f%z "$dmg") + 524288) / 1048576 ))
sed -i '' -E "s/Version [^<]+ MB/Version $version · $size_mb MB/" www/index.html
grep -q "Version $version · $size_mb MB" www/index.html \
    || { echo "error: website version line not updated" >&2; exit 1; }
sed -i '' -E "s|downloads\.advisor\.monoidal\.co\.uk/Advisor-[^\"]+\.dmg|downloads.advisor.monoidal.co.uk/Advisor-$version.dmg|" www/index.html
grep -q "downloads.advisor.monoidal.co.uk/Advisor-$version.dmg" www/index.html \
    || { echo "error: website download link not updated" >&2; exit 1; }
if ! git diff --quiet -- www/index.html; then
    git commit -m "release: v$version" -- www/index.html
fi
git tag "v$version"
echo "==> v$version released: $dmg ($size_mb MB)"
echo "    website synced; now: git push && git push origin v$version"
'''

[tasks.install]
description = "Install Advisor to ~/Applications"
run = "cd App && sh install.sh"

[tasks.run]
description = "Run the debug build"
run = "App/.build/debug/Advisor"
